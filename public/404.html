    p { margin: 20px auto 0; max-width: 32rem; color: #70665d; font-size: 16px; line-height: 1.9; }
    a { display: inline-flex; min-height: 48px; margin-top: 32px; align-items: center; justify-content: center; background: #2d2d2d; padding: 12px 24px; color: white; font-weight: 700; text-decoration: none; }

</head>
